resources:
- ns.yaml
- web.yaml
- emoji.yaml
- voting.yaml
- vote-bot.yaml

images:
  - name: emojivoto-web
    newName: localhost:5000/emojivoto-web
    newTag: 0.3.0
  - name: emojivoto-emoji
    newName: localhost:5000/emojivoto-emoji
    newTag: 0.3.0
  - name: emojivoto-voting
    newName: localhost:5000/emojivoto-voting
    newTag: 0.3.0

labels:
  - includeSelectors: true
    pairs:
      version: 0.3.0
  - includeTemplates: false
    pairs:
      app.kubernetes.io/version: 0.3.0